name: zenith_mobile
description: Zenith J.A.R.V.I.S. Mobile — cross-device management & phone tools
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  path_provider: ^2.1.0
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.6
  web_socket_channel: ^2.4.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9
  url_launcher: ^6.3.0
  android_intent_plus: ^5.0.2
  sensors_plus: ^6.0.1
  share_plus: ^10.0.2
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.3
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true